name: Palomar full mechanical preflight

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full 40-character source commit to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  palomar:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
    with:
      repository: ${{ github.repository }}
      commit: ${{ inputs.commit }}
      pipeline_commit: d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
      request_id: erdos206full
      mode: full
      execution_profile: palomar-standard-v1
      options: >-
        {"project_path":"formalization","formalization_metadata_path":"formalization.yaml","comparator_config_path":"formalization/comparator.json","authorization_relationship":"I am a responsible author or maintainer"}
