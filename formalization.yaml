related_formalizations: []

status:
  scope: >-
    Complete deterministic nested-interval construction and its universal
    negative conclusion for strict underapproximations with distinct positive
    integer denominators. The real limit uses classical choice in the proof
    layer; the precision-indexed rational approximation is a total executable
    definition with a proved bound for every index, including zero. A separate
    Partrec or Turing-machine representation, computational complexity estimate,
    measure-zero theorem, and the rational positive case are not supplied.
    The Challenge has two deliberate definition-value holes and a theorem proof
    hole; the Solution and substantive construction have no such holes.
  # These counts cover Solution and the substantive proof development only;
  # Challenge deliberately has two value interfaces and one theorem proof hole.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]

automation:
  methods:
    - method: "agent"
      models: []
      framework: "OpenAI Codex"
      tool_setup: >-
        AI tools assisted with the counterexample construction and its Lean
        formalization, including implementation and checks. The author is
        responsible for the stated results and registration.

fidelity:
  divergences: >-
    The manuscript uses positive distinct denominators and strict
    underapproximation. Kovač-Tang require denominators at least 2; on (0,1)
    this makes no difference. No first-existence, measure-zero novelty, first
    formalization, or global priority claim is made. The two-term local family
    is adapted from Kovač and the effective diagonal method is established.

review:
  status: "agent-reviewed"
  notes: >-
    The complete construction and independent statement bridge passed Lean
    4.35.0-rc2 with pinned Mathlib commit
    065356127b1dc0016f66b7283ce0ce2c4055aa55. Thirteen final axiom reports
    contained only propext, Quot.sound, and Classical.choice. No external
    author endorsement or journal peer review is asserted.

