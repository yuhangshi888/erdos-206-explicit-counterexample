# formalization.yaml v0.4
version: "v0.4"

project:
  name: "An explicit computable transcendental counterexample for Erdős Problem #206"
  description: >-
    A Lean formalization of a deterministic rational nested-interval construction
    defining a particular transcendental real x in (1/4,1/3). For this x, no
    strictly increasing infinite sequence of positive integer denominators is
    optimal among all distinct-denominator strict Egyptian underapproximations
    at every order from any finite starting order onward. The formalization
    includes the fully specified terminating construction, all prefix and
    polynomial enumerations, a total executable rational approximation function,
    and the error bound |x-q_n| <= 2^(-n-1) for every n >= 0. It also proves
    attainment of the best finite underapproximation values. The independent
    Palomar statement quantifies directly over all sequences and all competing
    positive increasing lists. This is a specific effective example; the
    measure-zero and prior existence results are not claimed as new.
  authors:
    - name: "Yuhang Shi"
      github: "yuhangshi888"
      orcid: "0009-0006-3180-4767"
  license: "AGPL-3.0"
  responsible_maintainers:
    - name: "Yuhang Shi"
      github: "yuhangshi888"
      orcid: "0009-0006-3180-4767"

